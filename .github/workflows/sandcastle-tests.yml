name: Sandcastle worker tests

# The Sandcastle host worker decides when to push and merge on this repository,
# so its own tests must run automatically. scripts/package.sh is the .NET
# project gate and never executes them.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent/linux-usability-release
  push:
    branches:
      - agent/linux-usability-release

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same flags as .sandcastle/host-poll.mts so CI and the trusted host
      # install the identical verified dependency tree.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Sandcastle worker tests
        run: npm run sandcastle:test
