name: Windows candidate package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/linux-usability-release

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423

      - name: Build, test, scan, and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Show verified hashes
        shell: pwsh
        run: Get-Content ./outputs/SHA256SUMS.txt

      - name: Upload candidate package and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LoL即時表現Overlay-windows-candidate
          path: |
            outputs/LoL即時表現Overlay.zip
            outputs/package-manifest.json
            outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
